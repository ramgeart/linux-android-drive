name: Build Linux Desktop App

on:
  push:
    branches: [ main, develop, copilot/* ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-24.04
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: 'gradle'
        
    - name: Install Linux dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libnotify-dev \
          libayatana-appindicator3-dev \
          flatpak \
          flatpak-builder
          
    - name: Build Linux Desktop App
      working-directory: linux-desktop
      run: |
        chmod +x ../gradlew
        ../gradlew :app:packageDeb
        ../gradlew :app:packageRpm
        
    - name: Create ZIP distribution
      working-directory: linux-desktop
      run: |
        mkdir -p dist/proton-drive-linux
        ../gradlew :app:createDistributable
        cp -r app/build/compose/binaries/main/app/* dist/proton-drive-linux/
        cd dist
        zip -r proton-drive-linux-x64.zip proton-drive-linux/
        
    - name: Upload DEB package
      uses: actions/upload-artifact@v4
      with:
        name: proton-drive-deb
        path: linux-desktop/app/build/compose/binaries/main/deb/*.deb
        
    - name: Upload RPM package
      uses: actions/upload-artifact@v4
      with:
        name: proton-drive-rpm
        path: linux-desktop/app/build/compose/binaries/main/rpm/*.rpm
        
    - name: Upload ZIP distribution
      uses: actions/upload-artifact@v4
      with:
        name: proton-drive-zip
        path: linux-desktop/dist/proton-drive-linux-x64.zip
        
  build-flatpak:
    runs-on: ubuntu-24.04
    needs: build-linux
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Install Flatpak and dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y flatpak flatpak-builder
        sudo flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
        sudo flatpak install -y flathub org.freedesktop.Platform//23.08 org.freedesktop.Sdk//23.08
        
    - name: Build Flatpak
      working-directory: linux-desktop
      run: |
        # TODO: Create flatpak manifest and build
        echo "Flatpak build will be implemented in next phase"
        
